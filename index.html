<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Le Parc Bistro – förslag på ny hemsida</title>
<meta property="og:title" content="Le Parc Bistro – förslag på ny hemsida">
<meta property="og:description" content="Två versioner med samma innehåll: en klassisk och en modern.">
<meta property="og:image" content="https://leparc.sluggan.com/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:#1f3329 url("img/park.jpg") center/cover;color:#f6f2ea;font:17px/1.5 'DM Sans',system-ui,sans-serif;padding:24px;position:relative}
  body::before{content:"";position:fixed;inset:0;background:rgba(18,30,24,.7)}
  main{max-width:660px;width:100%;text-align:center;position:relative}
  main>img{width:200px;height:auto;margin:0 auto 18px;display:block}
  h1{font:400 34px/1.15 'Fraunces',Georgia,serif;letter-spacing:-.01em;margin:0 0 8px}
  p{color:#d3dbd5;margin:0 0 30px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left}
  a{display:block;padding:24px;border-radius:14px;text-decoration:none;color:inherit;border:1px solid #4f6a5b;background:rgba(31,51,41,.92);transition:border-color .2s}
  a:hover{border-color:#b38b4d}
  a.modern{background:#f3ecdf;color:#1b211d;border-color:#f3ecdf}
  a.modern:hover{border-color:#d1492c}
  b{display:block;margin-bottom:4px}
  a:not(.modern) b{font:500 23px 'Playfair Display',serif}
  a.modern b{font:italic 400 24px 'Fraunces',serif;color:#14352a}
  small{opacity:.8;font-size:15px}
  @media (max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style>
</head>
<body>
<main>
  <img src="img/logo-vit.png" width="272" height="150" alt="Le Parc – Bistro i Börjeparken">
  <h1>Förslag på ny hemsida</h1>
  <p>Två versioner med samma innehåll. Testa gärna i mobilen.</p>
  <div class="grid">
    <a href="klassisk/"><b>Klassisk</b><small>Lik er nuvarande, grön och elegant, men renare och snabbare</small></a>
    <a class="modern" href="modern/"><b>Modern</b><small>Parisisk parkbistro med affischerna, menyflikar och snabbbokning</small></a>
  </div>
</main>
</body>
</html>
